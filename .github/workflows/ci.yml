name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project and scientific artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile source files
        run: python -m compileall -q src

      - name: Validate notebook and generated artifacts
        run: python -m unittest discover -s tests -v

      - name: Validate web research data and atlas mapping
        run: |
          python scripts/validate_web_data.py
          python scripts/validate_brain_region_mapping.py

  web:
    name: Build and test interactive brain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run web unit tests
        working-directory: web
        run: npm test

      - name: Build production application
        working-directory: web
        run: npm run build

      - name: Install browser for interaction tests
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Test desktop, mobile, and WebGL interactions
        working-directory: web
        run: npm run test:e2e
